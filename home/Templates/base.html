<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
    {% block head %}
        <!-- Font Awesome for Icons -->
        <script src="https://use.fontawesome.com/fc9938d86d.js"></script>
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <title>DaDps</title>
    {% endblock %}
</head>
<body style="min-height: 100%; padding-bottom: 50px; display: flex; flex-direction: column;">
    {% load static %}

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #1A3D6A;">
        <div class="container">
            <a class="navbar-brand" href="/" style="color: #B0D4E6;">DaDps</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    {% if username == "Guest" %}
                        <li class="nav-item">
                            <a class="nav-link" href="/patient_login/register" style="color: #B0D4E6;">
                                <i class="fa fa-user"></i> Register
                            </a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="/patient_login/profile" style="color: #B0D4E6;">
                                <i class="fa fa-user"></i> {{ username }}
                            </a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Body Content -->
    <div class="container" style="flex-grow: 1;">
        {% block body %}{% endblock %}
    </div>

    <!-- Bootstrap JS and jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
